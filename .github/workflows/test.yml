name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install httpx psutil pytest-cov
      - name: Run tests with coverage
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci
          JWT_ACCESS_SECRET_KEY: test-access-secret-for-ci
          JWT_REFRESH_SECRET_KEY: test-refresh-secret-for-ci
          ADMIN_USERNAME: admin
          LOG_LEVEL: WARNING
        run: |
          pytest tests/ \
            --tb=short \
            --cov=backend \
            --cov=pipelines \
            --cov=utils \
            --cov=router \
            --cov-report=term-missing \
            -q
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
